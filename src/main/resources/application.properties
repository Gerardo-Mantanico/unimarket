spring.application.name=gt
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

storage.provider=${STORAGE_PROVIDER:azure}
storage.azure.connection-string=${AZURE_BLOB_CONNECTION_STRING:}
storage.azure.container-name=${AZURE_BLOB_CONTAINER_NAME:documentos}
storage.azure.public-base-url=${AZURE_BLOB_PUBLIC_BASE_URL:https://<account>.blob.core.windows.net/documentos}

# Optional cloud backends
storage.s3.region=${AWS_REGION:}
storage.s3.bucket=${AWS_BUCKET:}
storage.s3.access-key=${AWS_ACCESS_KEY:}
storage.s3.secret-key=${AWS_SECRET_KEY:}
storage.s3.public-base-url=${AWS_PUBLIC_BASE_URL:}

storage.gcp.project-id=${GCP_PROJECT_ID:}
storage.gcp.bucket=${GCP_BUCKET:}
storage.gcp.credentials-json=${GCP_CREDENTIALS_JSON:}
storage.gcp.public-base-url=${GCP_PUBLIC_BASE_URL:}
